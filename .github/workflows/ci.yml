name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 语法检查
        run: |
          node --check lib/client.js
          node --check lib/index.js
          node --check tools/diag-sink.mjs
          node --check tools/check-manifest.mjs

      - name: 清单一致性自检
        run: node tools/check-manifest.mjs
