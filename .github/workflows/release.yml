name: release

# 推 v* 标签即发版：由 npm Trusted Publishing（OIDC）发布，仓库里不存任何 token。
# 首次使用前需在 npm 网页配置 Trusted Publisher：
#   https://www.npmjs.com/package/dsh-quote-annotate-pro/access
#     Organization or user : zhao-guang-ai
#     Repository           : dsh-quote-annotate-pro
#     Workflow filename    : release.yml
#     Environment name     : npm
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC：Trusted Publishing 与 provenance 都需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 升级 npm（Trusted Publishing 需要 npm >= 11.5.1）
        run: npm install -g npm@latest

      - name: 标签与 package.json 版本必须一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::标签 $TAG 与 package.json 版本 $PKG 不一致"
            exit 1
          fi

      - name: 语法检查与清单自检
        run: |
          node --check lib/client.js
          node --check lib/index.js
          node tools/check-manifest.mjs

      - name: 该版本是否已发布
        id: probe
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VER 已存在，跳过发布"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布（OIDC，无 token）
        if: steps.probe.outputs.skip != '1'
        run: npm publish --access public --provenance
